<!DOCTYPE html>
<html>
<head>
    <title>Smart Parking System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        .slots {
            display: grid;
            grid-template-columns: repeat(5, 150px);
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .slot {
            background-color: #4CAF50;
            color: white;
            padding: 25px;
            border-radius: 10px;
            font-size: 18px;
        }

        button {
            margin-top: 10px;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .reserve {
            background-color: white;
            color: green;
        }
    </style>
</head>

<body>

    <h1>🚗 Smart Parking System</h1>

    <h2>Available Parking Slots: {{ available_slots }}</h2>

    <div class="slots">

        {% for slot in range(1, 21) %}

        <div class="slot">

            🅿️ Slot {{ slot }}

            <br>

            <button class="reserve">
                Reserve
            </button>

        </div>

        {% endfor %}

    </div>

</body>
</html>
